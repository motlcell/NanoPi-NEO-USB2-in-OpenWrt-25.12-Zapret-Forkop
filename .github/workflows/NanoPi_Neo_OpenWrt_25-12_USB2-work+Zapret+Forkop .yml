name: Build OpenWrt for NanoPi NEO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "=== Диск ДО очистки ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo apt-get clean
          echo "=== Диск ПОСЛЕ очистки ==="
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 \
            rsync unzip zlib1g-dev file wget python3-distutils

      - name: Clone OpenWrt, Forkop & Zapret
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout v25.12.3
          
          # Клонирование forkop
          git clone https://github.com/itdoginfo/luci-app-forkop.git package/luci-app-forkop
          
          # Интеграция автономного пакета zapret (от bol-van)
          git clone --depth=1 https://github.com/bol-van/zapret.git /tmp/zapret
          cp -r /tmp/zapret/init.d/openwrt/zapret package/zapret
          rm -rf /tmp/zapret
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          rm -f .config
          
          # Base board architecture
          echo "CONFIG_TARGET_sunxi=y" > .config
          echo "CONFIG_TARGET_sunxi_cortexa7=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa7_DEVICE_friendlyarm_nanopi-neo=y" >> .config
          
          make defconfig
          
          # Configure rootfs size
          sed -i '/^CONFIG_TARGET_ROOTFS_PARTSIZE=/d' .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=12228" >> .config
          
          # Remove basic Wi-Fi packages to prevent conflicts with WPA3 versions
          sed -i '/CONFIG_PACKAGE_wpad-basic/d' .config
          sed -i '/CONFIG_PACKAGE_wpa-supplicant-basic/d' .config
          
          # Add all required packages
          {
            # USB drivers
            echo "CONFIG_PACKAGE_kmod-usb2=y"
            echo "CONFIG_PACKAGE_kmod-usb-ohci=y"
            echo "CONFIG_PACKAGE_kmod-usb-ehci-platform=y"
            echo "CONFIG_PACKAGE_usbutils=y"
            echo "CONFIG_PACKAGE_kmod-usb-storage=y"
            echo "CONFIG_PACKAGE_kmod-usb-net=y"
            echo "CONFIG_PACKAGE_kmod-usb-serial=y"
            echo "CONFIG_PACKAGE_kmod-usb-serial-option=y"
            echo "CONFIG_PACKAGE_kmod-usb-serial-wwan=y"
            echo "CONFIG_PACKAGE_usb-modeswitch=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y"
            
            # LuCI interface
            echo "CONFIG_PACKAGE_luci=y"
            echo "CONFIG_PACKAGE_luci-compat=y"
            
            # Activate languages (prevent defconfig from dropping them)
            echo "CONFIG_LUCI_LANG_ru=y"
            echo "CONFIG_LUCI_LANG_fr=y"
            echo "CONFIG_LUCI_LANG_de=y"
            echo "CONFIG_LUCI_LANG_bg=y"
            echo "CONFIG_LUCI_LANG_es=y"
            echo "CONFIG_LUCI_LANG_tr=y"
            
            # LuCI localization base packages
            echo "CONFIG_PACKAGE_luci-i18n-base-ru=y"
            echo "CONFIG_PACKAGE_luci-i18n-base-fr=y"
            echo "CONFIG_PACKAGE_luci-i18n-base-de=y"
            echo "CONFIG_PACKAGE_luci-i18n-base-bg=y"
            echo "CONFIG_PACKAGE_luci-i18n-base-es=y"
            echo "CONFIG_PACKAGE_luci-i18n-base-tr=y"
            
            # Additional LuCI modules
            echo "CONFIG_PACKAGE_luci-app-ttyd=y"
            echo "CONFIG_PACKAGE_luci-app-attendedsysupgrade=y"
            echo "CONFIG_PACKAGE_luci-app-openvpn=y"
            echo "CONFIG_PACKAGE_luci-app-wireguard=y"
            echo "CONFIG_PACKAGE_luci-app-advanced-reboot=y"
            echo "CONFIG_PACKAGE_luci-app-adblock=y"
            echo "CONFIG_PACKAGE_luci-app-dockerman=y"
            
            # Network utilities, Routing, and Firewall (Includes ss utility)
            echo "CONFIG_PACKAGE_iproute2-ss=y"
            echo "CONFIG_PACKAGE_kmod-nft-queue=y"
            echo "CONFIG_PACKAGE_ipset=y"
            echo "CONFIG_PACKAGE_git=y"
            echo "CONFIG_PACKAGE_dtc=y"
            echo "CONFIG_PACKAGE_grep=y"
            echo "CONFIG_PACKAGE_iw=y"
            echo "CONFIG_PACKAGE_dnsmasq=y"
            echo "CONFIG_PACKAGE_iptables-nft=y"
            echo "CONFIG_PACKAGE_firewall4=y"
            echo "CONFIG_PACKAGE_nftables=y"
            echo "CONFIG_PACKAGE_nftables-json=y"
            echo "CONFIG_PACKAGE_ip-full=y"
            echo "CONFIG_PACKAGE_tcpdump-mini=y"
            echo "CONFIG_PACKAGE_wireless-tools=y"
            
            # WPA3 and Wi-Fi security packages
            echo "CONFIG_PACKAGE_wpad-openssl=y"
            echo "CONFIG_PACKAGE_hostapd=y"
            echo "CONFIG_PACKAGE_hostapd-utils=y"
            echo "CONFIG_PACKAGE_wpa-supplicant-openssl=y"
            
            # Cellular and PPP connections
            echo "CONFIG_PACKAGE_wwan=y"
            echo "CONFIG_PACKAGE_kmod-ppp=y"
            echo "CONFIG_PACKAGE_kmod-pppoe=y"
            
            # L2TP Support
            echo "CONFIG_PACKAGE_xl2tpd=y"
            echo "CONFIG_PACKAGE_kmod-l2tp=y"
            echo "CONFIG_PACKAGE_kmod-l2tp-eth=y"
            echo "CONFIG_PACKAGE_kmod-l2tp-ip=y"
            echo "CONFIG_PACKAGE_luci-proto-ppp=y"
            
            # Специфические модули ядра и пакеты для работы forkop, zapret и TPROXY
            echo "CONFIG_PACKAGE_kmod-netlink-diag=y"
            echo "CONFIG_PACKAGE_kmod-nft-tproxy=y"
            echo "CONFIG_PACKAGE_kmod-nft-nat=y"
            echo "CONFIG_PACKAGE_kmod-ip6tables=y"
            echo "CONFIG_PACKAGE_luci-app-forkop=y"
            echo "CONFIG_PACKAGE_luci-i18n-forkop-ru=y"
            echo "CONFIG_PACKAGE_zapret=y"
            
            # Bluetooth components
            echo "CONFIG_PACKAGE_bluez-daemon=y"
            echo "CONFIG_PACKAGE_bluez-libs=y"
            echo "CONFIG_PACKAGE_bluez-tools=y"
            echo "CONFIG_PACKAGE_bluez-utils=y"
            echo "CONFIG_PACKAGE_kmod-bluetooth=y"
            
            # Wi-Fi drivers and firmwares
            echo "CONFIG_PACKAGE_kmod-cfg80211=y"
            echo "CONFIG_PACKAGE_kmod-mac80211=y"
            echo "CONFIG_PACKAGE_kmod-rtl8xxxu=y"
            echo "CONFIG_PACKAGE_kmod-rtw88=y"
            echo "CONFIG_PACKAGE_kmod-rtw88-8822c=y"
            echo "CONFIG_PACKAGE_kmod-rtw88-8822cu=y"
            echo "CONFIG_PACKAGE_kmod-rtw88-usb=y"
            echo "CONFIG_PACKAGE_rtl8188fu-firmware=y"
            echo "CONFIG_PACKAGE_rtl8188eu-firmware=y"
            echo "CONFIG_PACKAGE_rtl8812au-firmware=y"
            
            # Wired Ethernet drivers
            echo "CONFIG_PACKAGE_kmod-phy-realtek=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-rtl8150=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-rtl8152=y"
            
            # Base Linux utilities
            echo "CONFIG_PACKAGE_apk-mbedtls=y"
            echo "CONFIG_PACKAGE_bash=y"
            echo "CONFIG_PACKAGE_bash-completion=y"
            echo "CONFIG_PACKAGE_cli=y"
            echo "CONFIG_PACKAGE_curl=y"
            echo "CONFIG_PACKAGE_dmesg=y"
            echo "CONFIG_PACKAGE_findfs=y"
            echo "CONFIG_PACKAGE_findutils-find=y"
            echo "CONFIG_PACKAGE_findutils=y"
            echo "CONFIG_PACKAGE_fstools=y"
            echo "CONFIG_PACKAGE_fwtool=y"
            echo "CONFIG_PACKAGE_gpiod-tools=y"
            echo "CONFIG_PACKAGE_gpioctl-sysfs=y"
            echo "CONFIG_PACKAGE_hs20-client=y"
            echo "CONFIG_PACKAGE_hs20-server=y"
            echo "CONFIG_PACKAGE_mc=y"
            echo "CONFIG_PACKAGE_make=y"
            echo "CONFIG_PACKAGE_nano=y"
            echo "CONFIG_PACKAGE_sfdisk=y"
            echo "CONFIG_PACKAGE_ttyd=y"
            echo "CONFIG_PACKAGE_uboot-envtools=y"
            echo "CONFIG_PACKAGE_uci=y"
            echo "CONFIG_PACKAGE_usbids=y"
            echo "CONFIG_PACKAGE_wget=y"
            echo "CONFIG_PACKAGE_owut=y"
            
            # Docker core components
            echo "CONFIG_PACKAGE_docker=y"
            echo "CONFIG_PACKAGE_dockerd=y"
            echo "CONFIG_PACKAGE_docker-compose=y"
            echo "CONFIG_PACKAGE_runc=y"
            echo "CONFIG_PACKAGE_kmod-veth=y"
            echo "CONFIG_PACKAGE_kmod-br-netfilter=y"
            echo "CONFIG_PACKAGE_kmod-ipt-nat=y"
            echo "CONFIG_PACKAGE_kmod-ipt-extra=y"
            echo "CONFIG_PACKAGE_kmod-nf-nat=y"
            
            # Samba4 Network Server + LuCI App + Translations
            echo "CONFIG_PACKAGE_samba4-admin=y"
            echo "CONFIG_PACKAGE_samba4-client=y"
            echo "CONFIG_PACKAGE_samba4-libs=y"
            echo "CONFIG_PACKAGE_samba4-server=y"
            echo "CONFIG_PACKAGE_samba4-utils=y"
            echo "CONFIG_PACKAGE_luci-app-samba4=y"
            echo "CONFIG_PACKAGE_luci-i18n-samba4-ru=y"
            
            # Network proxies and VPN tools (Squid, TUN, inet-diag included)
            echo "CONFIG_PACKAGE_wireguard-tools=y"
            echo "CONFIG_PACKAGE_lua=y"
            echo "CONFIG_PACKAGE_squid=y"
            echo "CONFIG_PACKAGE_luci-app-squid=y"
            echo "CONFIG_PACKAGE_luci-i18n-squid-ru=y"
            echo "CONFIG_PACKAGE_luci-i18n-squid-fr=y"
            echo "CONFIG_PACKAGE_luci-i18n-squid-de=y"
            echo "CONFIG_PACKAGE_luci-i18n-squid-bg=y"
            echo "CONFIG_PACKAGE_luci-i18n-squid-es=y"
            echo "CONFIG_PACKAGE_luci-i18n-squid-tr=y"
            echo "CONFIG_PACKAGE_kmod-tun=y"
            echo "CONFIG_PACKAGE_kmod-inet-diag=y"
          } >> .config
          
          make defconfig

      - name: Download & Extract Kernel Source
        run: |
          cd openwrt
          make download -j"$(nproc)"
          make target/linux/prepare -j"$(nproc)" V=s || make target/linux/prepare -j1 V=s

      - name: Patch DTS for USB (Final Fix)
        run: |
          cd openwrt
          DTS_FILE=$(find build_dir/ -name "sun8i-h3-nanopi-neo.dts" | head -n 1)
          
          if [ -z "$DTS_FILE" ]; then
            echo "Critical error: DTS file not found!"
            exit 1
          fi
          
          echo "DTS file located at: $DTS_FILE"
          
          echo "" >> "$DTS_FILE"
          echo "&ehci2 { status = \"okay\"; };" >> "$DTS_FILE"
          echo "&ohci2 { status = \"okay\"; };" >> "$DTS_FILE"
          echo "&ehci3 { status = \"okay\"; };" >> "$DTS_FILE"
          echo "&ohci3 { status = \"okay\"; };" >> "$DTS_FILE"
          
          echo "=== Successfully appended USB ports to DTS ==="
          tail -n 10 "$DTS_FILE"

      - name: Add Custom Files (rc.local)
        run: |
          cd openwrt
          
          # Create folder structure for filesystem overlay
          mkdir -p files/etc
          
          # Write script to rc.local
          cat << 'EOF' > files/etc/rc.local
          #!/bin/sh

          REAL_PATH=""
          for p in /sys/bus/usb/drivers/rtl8xxxu/*:*; do
              if [ -e "$p" ]; then
                  ABS_PATH=$(readlink -f "$p")
                  REAL_PATH=${ABS_PATH##*devices/}
                  break
              fi
          done

          if [ -n "$REAL_PATH" ]; then
              for r in $(uci show wireless | grep =wifi-device | cut -d. -f2 | cut -d= -f1); do
                  if [ "$r" != "radio0" ]; then uci delete wireless.$r; fi
              done
              for iface in $(uci show wireless | grep =wifi-iface | cut -d. -f2 | cut -d= -f1); do
                  if [ "$iface" != "default_radio0" ]; then uci delete wireless.$iface; fi
              done

              uci set wireless.radio0.type='mac80211'
              uci set wireless.radio0.path="$REAL_PATH"
              uci set wireless.radio0.disabled='0'
              uci set wireless.default_radio0.device="radio0"
              uci commit wireless
              
              (sleep 4; wifi reload) &
          fi

          exit 0
          EOF
          
          chmod +x files/etc/rc.local
          
          echo "=== Checking created rc.local ==="
          cat files/etc/rc.local

      - name: Build Firmware
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify compiled files
        run: |
          echo "=== Searching for compiled firmware images ==="
          find openwrt/bin/targets/sunxi/cortexa7/ -type f -name "*.img*" -o -name "*.bin" -o -name "*.gz" 2>/devnull || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-nanopi-neo-firmware
          path: openwrt/bin/targets/sunxi/cortexa7/**/*
